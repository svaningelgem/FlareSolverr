[tool.ruff]
# Enable autofix behavior
fix = true
unsafe-fixes = true

# Ignored directories
exclude = [
    "src/bottle_plugins",
    "src/nodriver",
    "src/undetected_chromedriver",
]

# Line length
line-length = 120

# Target Python version
target-version = "py39"

[tool.ruff.lint]
# Basic checks: select all rules, focusing on error prevention, formatting, and best practices
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "TID",  # flake8-tidy-imports
]

[tool.ruff.lint.isort]
known-first-party = []  # Add your package name(s) here if needed